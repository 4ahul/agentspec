name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install agentspec + sample API deps
        run: |
          pip install -e ".[dev]"

      - name: Syntax check all source files
        run: |
          python -m py_compile src/agentspec/**/*.py src/agentspec/*.py

      - name: Start sample API
        run: |
          uvicorn examples.sample_api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Self-test — run agentspec against sample API
        run: |
          agentspec test examples/sample_api/main.py \
            --base-url http://localhost:8000 \
            --format junit \
            --output results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentspec-results-py${{ matrix.python-version }}
          path: results.xml
