[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentspec-cli"
version = "0.1.0"
description = "Auto-test and validate agent-generated APIs. CLI + MCP server for the agent era."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "agentspec contributors" }]
keywords = ["api", "testing", "agents", "mcp", "fastapi", "validation", "ai", "autofix", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
all = ["agentspec[mcp]"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
agentspec = "agentspec.cli.main:app"

[project.urls]
Homepage = "https://github.com/4ahul/agentspec"
Documentation = "https://github.com/4ahul/agentspec#readme"
Repository = "https://github.com/4ahul/agentspec"
Issues = "https://github.com/4ahul/agentspec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentspec"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
